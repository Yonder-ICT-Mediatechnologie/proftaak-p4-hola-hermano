
<style>
#erd2 { padding: 16px 0; }
h2.sr-only { position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0); }
.erd-title { font-size:14px;font-weight:500;color:var(--color-text-secondary);margin-bottom:12px;letter-spacing:.04em;text-transform:uppercase; }
.erd-note { font-size:12px;color:var(--color-text-tertiary);margin-top:10px; }
</style>
<h2 class="sr-only">Correcte ERD van LuxeDrive database: users, cars en personal_access_tokens</h2>
<div class="erd-title">LuxeDrive — Entity Relationship Diagram (v2)</div>
<div id="erd2"></div>
<div class="erd-note">* cars heeft geen directe FK naar users — toegang wordt geregeld via de Sanctum token op API-niveau.</div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2a2a35' : '#f0eef8',
    primaryBorderColor: dark ? '#534AB7' : '#7F77DD',
    primaryTextColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const diagram = `erDiagram
  users {
    bigint id PK
    varchar name
    varchar email UK
    varchar password
    timestamp created_at
    timestamp updated_at
  }
  cars {
    bigint id PK
    varchar make
    varchar model
    smallint year
    bigint price
    varchar power
    varchar accel
    varchar topspeed
    enum status
    varchar image
    text description
    timestamp created_at
    timestamp updated_at
  }
  personal_access_tokens {
    bigint id PK
    varchar tokenable_type
    bigint tokenable_id FK
    varchar name
    varchar token UK
    text abilities
    timestamp last_used_at
    timestamp created_at
    timestamp updated_at
  }
  users ||--o{ personal_access_tokens : "heeft tokens"
`;
const { svg } = await mermaid.render('erd-svg2', diagram);
document.getElementById('erd2').innerHTML = svg;

document.querySelectorAll('#erd2 svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd2 svg .row-rect-odd path, #erd2 svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
